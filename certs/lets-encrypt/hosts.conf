# hosts.conf
#
# One line per service: hostname, then the deploy SSH target
# (user@ip-or-name), then the remote reload command.
# Fields are separated by " | " — keep the spacing, the script splits on it.
#
# hostname                        | ssh target                | remote reload command
nas.home.yourdomain.com           | deploy@192.168.1.50       | sudo systemctl reload nginx
llm.home.yourdomain.com           | deploy@192.168.1.60       | sudo systemctl reload nginx
pi-service.home.yourdomain.com    | deploy@192.168.1.71       | sudo systemctl reload nginx
